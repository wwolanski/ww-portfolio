    <script>
      const homeLocaleMatch = window.location.pathname.match(/\/(pl|en)\/?$/);
      const isHomePath = window.location.pathname === '/' || homeLocaleMatch;

      if (isHomePath) {
        document.documentElement.classList.add('home-fonts-pending');
        document.querySelectorAll('[data-home-font-preload]').forEach((link) => { link.media = 'all'; });
        document.querySelectorAll('[data-home-preload]').forEach((link) => { link.media = 'all'; });

        if (homeLocaleMatch?.[1] === 'pl') {
          document.querySelectorAll('[data-home-font-preload-pl]').forEach((link) => { link.media = 'all'; });
        }
      }
    </script>
    <link rel="stylesheet" href="/src/styles/index.css" />
