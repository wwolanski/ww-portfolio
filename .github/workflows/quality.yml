name: Quality

# Temporarily manual-only while the repository content source is being reorganized.
# Restore the automatic pull_request and push triggers when CI is ready to return.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
